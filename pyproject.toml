[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcolor-drawiks"
version = "0.1.0"
description = "dcolor by drawiks"
requires-python = ">=3.7"
dependencies = []
readme = "README_en.md"

[project.urls]
Homepage = "https://github.com/drawiks/dcolor"

[tool.setuptools.packages.find]
where = ["."]
include = ["dcolor*"]
